name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install build and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
        python -m pip install -e ".[test,ml,llm,mcp,ui]"
        
    - name: Scan committed files for secrets
      # The PyPI release is the widest-reaching thing this repo does; it must
      # not depend on the CI workflow having run on the same commit.
      run: python scripts/scan_secrets.py --committed-only

    - name: Run unit tests
      env:
        USE_DEFAULT_PASSWORD: "true"
      run: |
        pytest -v -m unit
        
    - name: Build package
      run: python -m build
      
    - name: Check package metadata
      run: twine check dist/*
      
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload --skip-existing dist/*
